# Extension VLM settings, third candidate (configs/extension/plan.yaml models.candidates): the main-run settings
# (configs/main_run/vlm.yaml) with this model's loading, template and end tokens. Its language model is Qwen3, so
# a result with this model is reported as a partial generalization.
seed: 0

data:
  mvtec_root: data/mvtec_ad
  visa_root: data/visa
  visa_split_csv: data/visa/split_csv/1cls.csv
  type_names: configs/format_check/type_names.yaml

model:
  name: OpenGVLab/InternVL3_5-8B-HF
  revision: 741a7d03020411e666c6109218ab71e08151ef86
  device_map: {"": 0}
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: float16
  processor_use_fast: true
  # vision encoder and projector stay float16, only the language model is nf4 (checkpoint modules vision_tower,
  # multi_modal_projector); lm_head is listed because this list replaces the transformers default. Checked in X0
  # through the memory test record linear_layers
  skip_4bit_modules: ['.*vision_tower', '.*multi_modal_projector', '.*lm_head']
  # grouped-query attention (32 query, 8 key-value heads, Qwen3 language model): repeated first, as for Ministral
  # (src/clave_ad/vlm/model.py sdpa_repeat_kv)
  attn_implementation: sdpa_repeat_kv

generation:
  max_new_tokens: 512
  do_sample: false
  # <|im_end|> (generation_config.json eos_token_id)
  eos_token_ids: [151645]
  # no system prompt (the thinking-mode R1 system prompt is not used); the template inserts none by itself
  chat_template_kwargs: {}

prompts:
  dir: src/clave_ad/vlm/prompts
  b0: b0_v2.txt
  b1: b1_v2.txt
  b2: b2_v1.txt
  b3: b3_v1.txt
  requery: requery_v1.txt
  retry: retry_v2.txt
  output_rules: output_rules_v1.txt

detector:
  result: results/format_check/anomalyclip_20261014T045625Z.json

runtime:
  pytorch_cuda_alloc_conf: "expandable_segments:True"
